# Test configuration for GloboBank Fraud Detection Service
server:
  port: 0  # Random port for testing

spring:
  application:
    name: fraud-detection-service-test
  
  profiles:
    active: test
  
  # Database configuration - overridden by TestContainers
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
  
  # Flyway configuration for testing
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-on-validation-error: true
  
  # Security configuration for testing
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/auth/realms/test
          jwk-set-uri: http://localhost:8080/auth/realms/test/protocol/openid_connect/certs

# Management endpoints for testing
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# Logging configuration for testing
logging:
  level:
    com.globobank.fraud: DEBUG
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.testcontainers: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

# Test-specific fraud service configuration
fraud:
  detection:
    default-timeout: 2000  # Shorter timeout for testing
    circuit-breaker:
      failure-rate-threshold: 80  # Higher threshold for testing
      wait-duration-in-open-state: 5000  # Shorter wait for testing
      permitted-number-of-calls-in-half-open-state: 2
      minimum-number-of-calls: 5
  security:
    rate-limit:
      requests-per-minute: 1000  # Higher limit for testing
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"